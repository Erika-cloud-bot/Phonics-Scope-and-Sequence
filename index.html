<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word List Generator — Grade 3 Phonics</title>
<style>
  /* No web fonts, no external anything — this has to work with no internet. */
  :root {
    --ink:      #23201d;
    --ink-soft: #6b635c;
    --line:     #e2dcd4;
    --page:     #fbf9f6;
    --card:     #ffffff;
    --accent:   #b1543a;
    --t1:       #3f7d6b;
    --t2:       #4a6fa5;
    --t3:       #8a5a9b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font: 16px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink); background: var(--page);
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }

  header h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.01em; }
  header p  { margin: 0 0 24px; color: var(--ink-soft); font-size: 15px; }
  .student-link {
    display: inline-block; margin-left: 10px; padding: 3px 12px;
    background: var(--accent); color: #fff; text-decoration: none;
    border-radius: 40px; font-size: 14px; font-weight: 600;
  }
  .student-link:hover { filter: brightness(1.1); }

  /* ---- week picker ---- */
  .term { margin-bottom: 16px; }
  .term-label {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 8px;
  }
  .weeks { display: flex; flex-wrap: wrap; gap: 6px; }
  .week-btn {
    width: 44px; height: 40px; border: 1px solid var(--line);
    background: var(--card); border-radius: 8px; cursor: pointer;
    font: inherit; font-size: 14px; font-variant-numeric: tabular-nums;
    color: var(--ink); transition: background .12s, border-color .12s;
  }
  .week-btn:hover { border-color: var(--accent); }
  .week-btn.review { color: var(--ink-soft); background: #f4f1ec; }
  .week-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .t1 .week-btn.active { background: var(--t1); border-color: var(--t1); }
  .t2 .week-btn.active { background: var(--t2); border-color: var(--t2); }
  .t3 .week-btn.active { background: var(--t3); border-color: var(--t3); }

  /* ---- controls ---- */
  .controls {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    padding: 14px 16px; margin: 20px 0; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .controls label { font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .controls .spacer { flex: 1; }
  button.action {
    font: inherit; font-size: 14px; padding: 7px 14px; cursor: pointer;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px;
  }
  button.action:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- week detail ---- */
  .detail { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 20px; }
  .detail h2 { margin: 0 0 2px; font-size: 20px; }
  .detail .meta { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .detail dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 14px 0 0; font-size: 14px; }
  .detail dt { color: var(--ink-soft); }
  .detail dd { margin: 0; }

  /* ---- word groups ---- */
  .group { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; margin-bottom: 16px; }
  .group h3 { margin: 0 0 12px; font-size: 17px; }
  .note {
    font-size: 14px; color: var(--ink-soft); background: #f7f4ef;
    border-left: 3px solid var(--accent); padding: 9px 13px;
    border-radius: 0 6px 6px 0; margin: 0 0 14px;
  }
  .tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; }
  .tier-name {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--ink-soft);
    padding-bottom: 5px; border-bottom: 1px solid var(--line); margin-bottom: 9px;
  }
  .tier ul { list-style: none; margin: 0; padding: 0; }
  .tier li { padding: 2px 0; font-size: 17px; }

  .empty { color: var(--ink-soft); font-style: italic; }

  /* ---- print: just the words, big and clean ---- */
  @media print {
    body { background: #fff; }
    .wrap { max-width: none; padding: 0; }
    .term, .controls, header p, .no-print { display: none !important; }
    .detail, .group { border: none; padding: 0 0 14px; margin: 0 0 14px; break-inside: avoid; }
    .detail { border-bottom: 2px solid #000 !important; }
    .note { background: none; border-left: 2px solid #999; }
    .tier li { font-size: 18px; padding: 3px 0; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Word List Generator</h1>
    <p class="no-print">Grade 3 Ontario phonics, word study &amp; grammar — pick a week to generate practice words.
      <a href="student.html" class="student-link">Student practice app →</a>
      <a href="progress.html" class="student-link" style="background:#4a6fa5">Progress →</a></p>
  </header>

  <div id="picker"></div>

  <div class="controls no-print">
    <label><input type="checkbox" class="tier-toggle" value="easy" checked> Easy</label>
    <label><input type="checkbox" class="tier-toggle" value="core" checked> Core</label>
    <label><input type="checkbox" class="tier-toggle" value="challenge" checked> Challenge</label>
    <label>Max per tier
      <select id="limit">
        <option value="0">all</option>
        <option value="5">5</option>
        <option value="8">8</option>
        <option value="10">10</option>
      </select>
    </label>
    <span class="spacer"></span>
    <button class="action" id="shuffle">Shuffle</button>
    <button class="action" id="copy">Copy</button>
    <button class="action" id="print">Print</button>
  </div>

  <div id="output"></div>

</div>

<script src="data/sequence.js"></script>
<script src="data/wordbank.js"></script>
<script>
(function () {
  "use strict";

  /* Open on the first week that actually has a pattern. Week 1 is routines,
     so defaulting to it would show an empty page — which reads as broken.
     Computed rather than hardcoded, so it still holds if the sequence changes. */
  var firstContentWeek = (window.SEQUENCE.find(function (w) { return w.patterns.length > 0; }) || window.SEQUENCE[0]).week;

  var selectedWeek = firstContentWeek;
  var shuffleOn    = false;

  var picker = document.getElementById("picker");
  var output = document.getElementById("output");

  /* Build the week buttons, grouped by term. */
  function buildPicker() {
    picker.innerHTML = "";
    [1, 2, 3].forEach(function (t) {
      var info  = window.TERMS[t];
      var block = document.createElement("div");
      block.className = "term t" + t;

      var label = document.createElement("div");
      label.className = "term-label";
      label.textContent = info.name + " · " + info.months;
      block.appendChild(label);

      var row = document.createElement("div");
      row.className = "weeks";

      window.SEQUENCE.filter(function (w) { return w.term === t; }).forEach(function (w) {
        var b = document.createElement("button");
        b.className = "week-btn" + (w.patterns.length === 0 ? " review" : "") +
                      (w.week === selectedWeek ? " active" : "");
        b.textContent = w.week;
        b.title = "Week " + w.week + ": " + w.focus;
        b.addEventListener("click", function () {
          selectedWeek = w.week;
          buildPicker();
          render();
        });
        row.appendChild(b);
      });

      block.appendChild(row);
      picker.appendChild(block);
    });
  }

  /* Fisher-Yates, on a copy so the source list is never disturbed. */
  function shuffled(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function activeTiers() {
    return Array.prototype.slice
      .call(document.querySelectorAll(".tier-toggle"))
      .filter(function (c) { return c.checked; })
      .map(function (c) { return c.value; });
  }

  function wordsFor(entry, tier) {
    var list = entry[tier] || [];
    if (shuffleOn) list = shuffled(list);
    var limit = parseInt(document.getElementById("limit").value, 10);
    return limit > 0 ? list.slice(0, limit) : list;
  }

  /* Render one pattern's three tiers. */
  function groupEl(key) {
    var entry = window.WORDBANK[key];
    if (!entry) {
      var missing = document.createElement("div");
      missing.className = "group";
      missing.innerHTML = "<h3>" + key + "</h3><p class='empty'>No words in the bank for this pattern yet.</p>";
      return missing;
    }

    var g = document.createElement("div");
    g.className = "group";

    var h = document.createElement("h3");
    h.textContent = entry.label;
    g.appendChild(h);

    if (entry.note) {
      var n = document.createElement("p");
      n.className = "note";
      n.textContent = entry.note;
      g.appendChild(n);
    }

    var tiers = document.createElement("div");
    tiers.className = "tiers";

    activeTiers().forEach(function (tier) {
      var words = wordsFor(entry, tier);
      if (!words.length) return;

      var col = document.createElement("div");
      col.className = "tier";

      var name = document.createElement("div");
      name.className = "tier-name";
      name.textContent = tier + " · " + words.length;
      col.appendChild(name);

      var ul = document.createElement("ul");
      words.forEach(function (w) {
        var li = document.createElement("li");
        li.textContent = w;
        ul.appendChild(li);
      });
      col.appendChild(ul);
      tiers.appendChild(col);
    });

    g.appendChild(tiers);
    return g;
  }

  function render() {
    var week = window.SEQUENCE.find(function (w) { return w.week === selectedWeek; });
    output.innerHTML = "";

    var d = document.createElement("div");
    d.className = "detail";
    d.innerHTML =
      "<h2>Week " + week.week + " — " + week.focus + "</h2>" +
      "<p class='meta'>" + window.TERMS[week.term].name + " · " + window.TERMS[week.term].months + "</p>" +
      "<dl><dt>Grammar</dt><dd>" + week.grammar + "</dd></dl>";
    output.appendChild(d);

    var keys = week.patterns.concat(week.morphology);
    if (!keys.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "This is a review, routines, or assessment week — no new pattern, so no word list. " +
                      "Pick any numbered week above to pull its words for revision.";
      output.appendChild(p);
      return;
    }
    keys.forEach(function (k) { output.appendChild(groupEl(k)); });
  }

  /* Plain text of what's on screen, for pasting into a doc. */
  function asText() {
    var week = window.SEQUENCE.find(function (w) { return w.week === selectedWeek; });
    var out  = ["Week " + week.week + " — " + week.focus, ""];
    week.patterns.concat(week.morphology).forEach(function (k) {
      var entry = window.WORDBANK[k];
      if (!entry) return;
      out.push(entry.label);
      activeTiers().forEach(function (tier) {
        var words = wordsFor(entry, tier);
        if (words.length) out.push("  " + tier + ": " + words.join(", "));
      });
      out.push("");
    });
    return out.join("\n");
  }

  document.getElementById("shuffle").addEventListener("click", function () {
    shuffleOn = true;
    render();
  });

  document.getElementById("print").addEventListener("click", function () { window.print(); });

  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    var done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy"; }, 1400); };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(asText()).then(done, done);
    } else {
      // file:// on some browsers blocks the clipboard API — fall back to a textarea.
      var ta = document.createElement("textarea");
      ta.value = asText();
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  });

  document.querySelectorAll(".tier-toggle").forEach(function (c) {
    c.addEventListener("change", render);
  });
  document.getElementById("limit").addEventListener("change", render);

  buildPicker();
  render();
})();
</script>
</body>
</html>
