<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Practice</title>
<style>
  /* Nothing loads from the internet. Everything here runs on a Chromebook
     with the wifi off, opened straight from the file. */
  :root {
    --ink: #2b2724; --soft: #6f665f; --card: #fff; --line: #e7ddd0;
    --good: #3f8f5f; --bad: #c4553d; --gold: #f0a92e;
    --page: #fff8ec; --deep: #3b7ea1; --glow: #eaf4f8;
    --sky-1: #eaf4f8; --sky-2: #f4fafc;
  }
  /* A world is a place, not a colour swatch: each one gets a sky overhead, a
     ground underfoot, and animals living in it. The sky runs from --page at the
     top, where the words are read, down through --sky-2 to --sky-1 at the
     horizon — so the page can be a forest and still be black text on paper. */
  body.w-forest { --page:#f6fbf1; --deep:#3f7d4e; --glow:#e4f0dd;
                  --sky-1:#cfe9f2; --sky-2:#e9f5e4; }
  body.w-ocean  { --page:#f3fafd; --deep:#2f6f92; --glow:#dceaf2;
                  --sky-1:#c3e6f4; --sky-2:#e2f2f9; }
  body.w-space  { --page:#f8f4fd; --deep:#6a4f96; --glow:#e8e0f4;
                  --sky-1:#d5c8ee; --sky-2:#ebe3f7; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; font: 18px/1.5 "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(var(--page) 0%, var(--sky-2) 46%, var(--sky-1) 100%) fixed;
    display: flex; flex-direction: column; align-items: center;
    transition: background .4s;
  }
  .screen { width: 100%; max-width: 820px; padding: 18px 16px 40px; position: relative; z-index: 1; }
  .hidden { display: none !important; }
  h1 { font-size: 28px; margin: 6px 0; }
  .sub { color: var(--soft); margin: 0 0 20px; }

  /* ---- the world itself ----
     Three layers, none of which a word ever has to be read on top of:
       body::before  air — pollen, bubbles or starlight drifting behind
       .ground       the bottom band, pushed below the content by margin-top:auto
       .world-scene  the picture-book banner at the top of the home screen
     All of it is SVG written in this file, so a Chromebook with the wifi off
     still gets the whole forest. */
  body::before {
    content: ""; position: fixed; left: 0; right: 0; top: -30%; bottom: -30%;
    pointer-events: none; z-index: 0; opacity: .55;
    background-repeat: repeat;
  }
  body.w-forest::before {
    /* pollen drifting up through the trees */
    background-image:
      radial-gradient(circle, rgba(240,169,46,.55) 1.6px, transparent 2px),
      radial-gradient(circle, rgba(63,125,78,.4) 1.2px, transparent 1.8px);
    background-size: 190px 150px, 130px 210px;
    background-position: 0 0, 60px 40px;
    animation: airUp 34s linear infinite;
  }
  body.w-ocean::before {
    /* bubbles rising */
    background-image:
      radial-gradient(circle, rgba(255,255,255,.85) 3px, transparent 3.6px),
      radial-gradient(circle, rgba(255,255,255,.6) 1.8px, transparent 2.4px);
    background-size: 240px 190px, 150px 130px;
    background-position: 0 0, 90px 30px;
    animation: airUp 22s linear infinite;
  }
  body.w-space::before {
    /* starlight */
    background-image:
      radial-gradient(circle, rgba(106,79,150,.6) 1.7px, transparent 2.2px),
      radial-gradient(circle, rgba(240,169,46,.55) 1.3px, transparent 1.8px);
    background-size: 170px 170px, 110px 140px;
    background-position: 0 0, 55px 70px;
    animation: starPulse 5s ease-in-out infinite;
  }
  @keyframes airUp { from { transform: translateY(0); } to { transform: translateY(-210px); } }
  @keyframes starPulse { 0%,100% { opacity: .35; } 50% { opacity: .7; } }

  /* The bottom band sits in the flow, after every screen, so it can never end
     up behind a word. Short screens push it to the bottom of the window; long
     ones let it slide down under the last button. */
  .ground { width: 100%; margin-top: auto; line-height: 0; pointer-events: none; z-index: 0; }
  .ground svg { display: block; width: 100%; height: clamp(100px, 17vh, 168px); }
  /* The home screen has the banner up top and a lot to fit underneath it, so it
     doesn't carry the band as well — two helpings of scenery there push the
     week buttons off a Chromebook screen. */
  body.at-home .ground { display: none; }

  .world-scene {
    width: 100%; line-height: 0; overflow: hidden; margin: 0 0 16px;
    border: 4px solid #fff; border-radius: 22px; box-shadow: 0 6px 16px rgba(43,39,36,.15);
  }
  /* height:auto lets the picture keep its own 4:1 shape at every width, so the
     scene is never cropped — a banner that crops eats the fox's feet first,
     since everything alive in it is standing on the ground at the bottom. */
  .world-scene svg { display: block; width: 100%; height: auto; }

  /* Choosing a world is the most exciting button on the page, so it looks like
     a place you can go rather than a tab. The world you're not in is faded, the
     way the lights go down on the rest of the map. */
  .worlds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .wcard {
    font: inherit; cursor: pointer; color: var(--ink); background: var(--card);
    border: 3px solid var(--line); border-radius: 18px; padding: 10px 6px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    opacity: .68; filter: saturate(.5);
    transition: transform .15s, opacity .2s, filter .2s, box-shadow .15s;
  }
  .wcard svg { width: 52px; height: 52px; }
  .wcard .wname { font-size: 15px; font-weight: 700; line-height: 1.15; text-align: center; }
  .wcard:hover { transform: translateY(-3px); opacity: .9; }
  .wcard.on {
    opacity: 1; filter: none; border-color: var(--wc);
    box-shadow: 0 5px 0 var(--wc); transform: translateY(-2px);
  }
  .wcard.w1 { --wc:#3f7d4e; } .wcard.w2 { --wc:#2f6f92; } .wcard.w3 { --wc:#6a4f96; }

  /* Gentle, slow, and only ever on decoration — nothing moves near a word.
     During a round even that is turned down, so the scenery doesn't compete
     with the thing being read. */
  .float  { animation: float 4.5s ease-in-out infinite; }
  .float2 { animation: float 6s ease-in-out infinite -1.8s; }
  .swim   { animation: swim 9s ease-in-out infinite; }
  .swim2  { animation: swim 12s ease-in-out infinite -4s; }
  .sway   { animation: sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  .sway2  { animation: sway 6.5s ease-in-out infinite -2s; transform-box: fill-box; transform-origin: bottom center; }
  .twinkle  { animation: twinkle 3s ease-in-out infinite; }
  .twinkle2 { animation: twinkle 4.2s ease-in-out infinite -1.5s; }
  .flame  { animation: flame .28s steps(2) infinite; transform-box: fill-box; transform-origin: top center; }
  @keyframes float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes swim   { 0%,100% { transform: translateX(0); } 50% { transform: translateX(38px) translateY(-10px); } }
  @keyframes sway   { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
  @keyframes twinkle{ 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  @keyframes flame  { 0% { transform: scaleY(.82); } 100% { transform: scaleY(1.1); } }

  body.playing .ground svg { opacity: .4; }
  body.playing::before { opacity: .18; }

  @media (prefers-reduced-motion: reduce) {
    .float, .float2, .swim, .swim2, .sway, .sway2,
    .twinkle, .twinkle2, .flame, body::before { animation: none !important; }
  }

  /* ---- mascot ---- */
  .pip { width: 92px; height: 92px; flex: none; }
  .pip .body  { fill: var(--deep); }
  .pip .belly { fill: var(--glow); }
  .pip .beak  { fill: var(--gold); }
  .greet { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .bubble {
    background: var(--card); border: 2px solid var(--line); border-radius: 16px;
    padding: 10px 16px; font-size: 18px; position: relative;
  }
  .bubble::before {
    content: ""; position: absolute; left: -9px; top: 20px;
    border: 8px solid transparent; border-right-color: var(--line);
  }

  /* ---- buttons ---- */
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    font: inherit; cursor: pointer; border-radius: 12px; padding: 12px 18px;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
  }
  .btn:hover:not(:disabled) { border-color: var(--deep); }
  .btn.primary { background: var(--deep); border-color: var(--deep); color: #fff; font-weight: 700; }
  .btn.block { display: block; width: 100%; margin-top: 10px; font-size: 19px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .wk { min-width: 48px; height: 46px; font-variant-numeric: tabular-nums; padding: 0 10px; }
  .wk.on { background: var(--deep); border-color: var(--deep); color: #fff; font-weight: 700; }

  .acts { display: grid; grid-template-columns: repeat(auto-fit,minmax(210px,1fr)); gap: 12px; margin-top: 6px; }
  .act { text-align: left; padding: 16px; border-radius: 15px; }
  .act .emoji { font-size: 28px; display: block; }
  .act .name  { font-weight: 700; font-size: 18px; display: block; }
  .act .why   { color: var(--soft); font-size: 14px; }

  .stars-line { font-size: 20px; color: var(--gold); letter-spacing: 2px; }

  /* ---- play ---- */
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .dots { display: flex; gap: 5px; flex: 1; }
  .dot { width: 100%; height: 8px; border-radius: 4px; background: var(--line); }
  .dot.done { background: var(--good); } .dot.miss { background: var(--bad); } .dot.now { background: var(--deep); }
  .quit { border: none; background: none; font: inherit; font-size: 15px; color: var(--soft); cursor: pointer; text-decoration: underline; }

  .stage { text-align: center; padding: 18px 6px 14px; }
  .pic { font-size: 76px; line-height: 1; margin-bottom: 6px; }
  .the-word { font-size: clamp(42px,11vw,76px); font-weight: 700; margin: 0; }
  .the-word .gap { display: inline-block; min-width: 1.3em; border-bottom: 6px solid var(--gold); color: transparent; }
  .say { margin-top: 12px; border-radius: 40px; padding: 8px 18px; font-size: 16px; }

  .choices { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .choice {
    min-width: 130px; padding: 18px 22px; font-size: 25px; font-weight: 700;
    border-width: 3px; border-radius: 15px;
  }
  .choice.right { background: var(--good); border-color: var(--good); color: #fff; }
  .choice.wrong { background: var(--bad);  border-color: var(--bad);  color: #fff; }
  .choice .small { display: block; font-size: 13px; font-weight: 400; opacity: .85; }

  /* Hear It — no word on screen, so the speaker is the whole stage. */
  .listen-big { font-size: 72px; line-height: 1; }

  /* Spell It — letter tiles, and the word being built above them. */
  .built {
    font-size: clamp(34px,9vw,58px); font-weight: 700; letter-spacing: 5px;
    min-height: 1.25em; margin-top: 10px;
  }
  .built .blank { color: var(--line); }
  .built.right { color: var(--good); } .built.wrong { color: var(--bad); }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .tile {
    font: inherit; font-size: 26px; font-weight: 700; width: 56px; height: 60px;
    border-radius: 12px; border: 3px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer;
  }
  .tile:hover:not(:disabled) { border-color: var(--deep); }
  .tile:disabled { opacity: .22; cursor: default; }

  .feedback { text-align: center; font-size: 21px; font-weight: 700; min-height: 32px; margin-top: 16px; }
  .feedback.good { color: var(--good); } .feedback.bad { color: var(--bad); }
  /* The rule behind the answer. Quieter than the verdict above it, because the
     verdict is glanced at and this is read. */
  .feedback .why { display: block; font-weight: 400; font-size: 17px; color: var(--soft); margin-top: 6px; }

  /* ---- grammar ---- */
  .strand { font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .08em; color: var(--soft); margin: 20px 0 8px; }
  .ask { font-size: 19px; color: var(--soft); margin: 0 0 14px; }
  .sent { font-size: clamp(21px,4.6vw,29px); line-height: 1.9; margin: 0; }
  /* Every word is tappable, so none of them may look more tappable than the
     rest — a border that only appears on hover keeps the sentence a sentence. */
  .tok {
    font: inherit; background: none; color: inherit; cursor: pointer;
    border: 2px solid transparent; border-radius: 9px; padding: 1px 5px; margin: 0 1px;
  }
  .tok:hover:not(:disabled) { border-color: var(--deep); }
  .tok:disabled { cursor: default; }
  .tok.right { background: var(--good); border-color: var(--good); color: #fff; }
  .tok.wrong { background: var(--bad);  border-color: var(--bad);  color: #fff; }

  .blankw { display: inline-block; min-width: 2.4em; text-align: center;
            border-bottom: 5px solid var(--gold); }
  /* Wide enough to be seen while it's empty, then closed up around the answer
     so the finished sentence reads as a sentence — a comma sitting alone in a
     2.4em box looks like a mistake. */
  .blankw.filled { min-width: 0; border-bottom-color: transparent; font-weight: 700; }
  .blankw.right { color: var(--good); } .blankw.wrong { color: var(--bad); }

  /* Fix It offers whole sentences, so they stack instead of sitting in a row. */
  .choices.stack { flex-direction: column; align-items: stretch; }
  .choices.stack .choice { min-width: 0; font-size: 20px; text-align: left; }

  /* Only appears once an answer is in, so it can't be mistaken for a choice.
     Waiting does the same thing — this is for readers who are already done. */
  .next-btn { display: block; margin: 14px auto 0; min-width: 190px; font-size: 19px; }

  /* ---- done ---- */
  .score { text-align: center; }
  .score .big { font-size: 56px; font-weight: 700; line-height: 1.1; }
  .got-stars { font-size: 38px; letter-spacing: 6px; color: var(--gold); }
  .tricky { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-top: 18px; }
  .tricky h3 { margin: 0 0 6px; font-size: 16px; }
  .tricky ul { margin: 0; padding-left: 20px; font-size: 19px; }
  .name-input { font: inherit; font-size: 19px; padding: 12px; border: 2px solid var(--line); border-radius: 12px; width: 100%; max-width: 320px; }
</style>
</head>
<body>

<!-- ===== WHO ===== -->
<div class="screen" id="s-who">
  <div class="greet">
    <div id="pipWho"></div>
    <div class="bubble">Hi! Who's practising today?</div>
  </div>
  <div class="row" id="whoList" style="margin:18px 0"></div>
  <div id="whoNew"></div>
</div>

<!-- ===== HOME ===== -->
<div class="screen hidden" id="s-home">
  <div class="world-scene" id="worldScene" aria-hidden="true"></div>
  <div class="greet">
    <div id="pipHome"></div>
    <div class="bubble" id="homeMsg"></div>
  </div>
  <p class="stars-line" id="homeStars"></p>

  <p class="sub" style="margin:18px 0 6px"><strong id="worldName"></strong></p>
  <div class="worlds" id="worldTabs"></div>
  <div class="row" id="weekList"></div>

  <div id="actWrap" class="hidden">
    <p class="sub" style="margin:22px 0 4px"><strong id="weekFocus"></strong></p>
    <div id="wordWrap">
      <p class="strand">Word study</p>
      <div class="acts" id="acts"></div>
    </div>
    <div id="gramWrap">
      <p class="strand" id="gramLabel">Grammar</p>
      <div class="acts" id="gacts"></div>
    </div>
  </div>

  <button class="btn block" id="switchUser" style="margin-top:26px">Not you? Switch reader</button>
</div>

<!-- ===== PLAY ===== -->
<div class="screen hidden" id="s-play">
  <div class="bar">
    <div class="dots" id="dots"></div>
    <button class="quit" id="quit">Stop</button>
  </div>
  <div id="stage"></div>
  <div class="feedback" id="feedback"></div>
  <button class="btn primary next-btn hidden" id="nextBtn">Next →</button>
</div>

<!-- ===== DONE ===== -->
<div class="screen hidden" id="s-done">
  <div class="greet">
    <div id="pipDone"></div>
    <div class="bubble" id="doneMsg"></div>
  </div>
  <div class="score">
    <div class="big" id="scoreBig"></div>
    <div class="got-stars" id="gotStars"></div>
  </div>
  <div id="trickyBox"></div>
  <button class="btn primary block" id="keepGoing">Keep going →</button>
  <button class="btn block" id="pickOther">Choose something else</button>
</div>

<div class="ground" id="ground" aria-hidden="true"></div>

<script src="data/sequence.js"></script>
<script src="data/wordbank.js"></script>
<script src="data/meanings.js"></script>
<script src="data/grammar.js"></script>
<script>
(function () {
  "use strict";

  var ROUND = 10;
  var STORE = "phonics.progress.v1";

  /* ---- how long the feedback stays on screen ----
     Tuned for Step 1 ESL readers, who are the slowest readers in the room and
     so the ones who decide this number. A pause that's too long costs a strong
     reader a moment they can skip with the Next button; a pause that's too
     short costs a beginner the explanation entirely. That trade is one-sided,
     so this errs slow.

     READ_MS_PER_CHAR 200 is about 55 words a minute — an unhurried beginner
     reading English print, with a little thinking time on top. The first
     READ_FREE_CHARS are free so short confirmations ("Yes — cat!") stay snappy.

     To change the pace for your class, change these two numbers and nothing
     else. Higher READ_MS_PER_CHAR = longer pauses. */
  var READ_MS_PER_CHAR = 200;
  var READ_FREE_CHARS  = 12;
  var READ_MIN_RIGHT   = 900;    // floor after a correct answer
  var READ_MIN_WRONG   = 1500;   // floor after a wrong one — more to take in
  var READ_MAX         = 12000;  // nothing should strand a child longer than this

  var GRAPHEME = { "ow-long-o":"ow","ow-loud":"ow","oo-long":"oo","oo-short":"oo",
    "er-r":"er","er-agent":"er","soft-c":"c","soft-g":"g","consonant-le":"le" };

  var SHORT = { "oo-long":"oo — moon","oo-short":"oo — book","ow-long-o":"ow — snow",
    "ow-loud":"ow — cow","soft-c":"soft c","soft-g":"soft g","er-r":"er",
    "er-agent":"-er / -or","consonant-le":"-le","plural-s":"-s","plural-es":"-es",
    "plural-ies":"-ies","plural-irregular":"irregular","open-syllable":"open",
    "syllable-division":"split it","short-vowels":"short vowel",
    "homophones-1":"their / there","homophones-2":"to / too / two","compound":"compound",
    "schwa":"schwa","contractions":"contraction","etymology":"word origin","irregular":"tricky",
    /* Prefixes and suffixes need their hyphen, or Sort It offers a column
       headed "less" and Odd One Out says "the others are less words". */
    "un":"un-","re":"re-","dis":"dis-","pre":"pre-","mis":"mis-","non":"non-","over":"over-",
    "ful":"-ful","less":"-less","ly":"-ly","ness":"-ness","tion":"-tion","sion":"-sion",
    "able":"-able","ment":"-ment","ous":"-ous" };

  var NO_GRAPHEME = ["short-vowels","open-syllable","syllable-division","homophones-1",
    "homophones-2","compound","plural-s","plural-es","plural-ies","plural-irregular",
    "schwa","contractions","etymology","irregular"];

  /* Words the voice says wrongly, and a spelling it says correctly. Only the
     SOUND changes — the child still sees the real word on screen.

     This needs your ear, not mine: if you hear a word come out wrong, tell me
     what it said and I'll add a line. Format is  "word": "how to say it",
     e.g. "bow": "boe" to force the long-o bow rather than bowing. */
  var SAY_AS = {
    "bow": "boe",     // Week 5 wants the long-o bow (🎀), not /baʊ/
    "jamb": "jam",    // silent b
    "gnu": "noo"      // silent g
  };

  var WORLDS = {
    1: { css:"w-forest", name:"The Forest 🌲", short:"The Forest", term:1 },
    2: { css:"w-ocean",  name:"The Ocean 🌊",  short:"The Ocean",  term:2 },
    3: { css:"w-space",  name:"Deep Space 🚀", short:"Deep Space", term:3 }
  };

  /* state.level is set from the reader's saved level when they're picked.
     It is never shown on screen — a child doesn't need to be told which
     pile they're in. It only decides which words come up. */
  var state = { who:null, level:"mixed", world:1, week:null, activity:null,
                queue:[], at:0, right:0, tricky:[], rotate:0, foils:null };

  var $ = function (id) { return document.getElementById(id); };

  // ---------- mascot ----------
  /* Pip — drawn here in shapes, so there's no image file and nothing to load.
     mood: "hi" | "cheer" | "think" */
  function pip(mood) {
    var eyes = mood === "cheer"
      ? '<path d="M32 40 q6 -7 12 0" stroke="#2b2724" stroke-width="3.5" fill="none" stroke-linecap="round"/>' +
        '<path d="M56 40 q6 -7 12 0" stroke="#2b2724" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
      : '<circle cx="38" cy="42" r="7" fill="#fff"/><circle cx="62" cy="42" r="7" fill="#fff"/>' +
        '<circle cx="' + (mood === "think" ? 40 : 38) + '" cy="43" r="3.4" fill="#2b2724"/>' +
        '<circle cx="' + (mood === "think" ? 64 : 62) + '" cy="43" r="3.4" fill="#2b2724"/>';
    var mouth = mood === "think"
      ? '<path d="M44 66 q6 4 12 0" stroke="#2b2724" stroke-width="3" fill="none" stroke-linecap="round"/>'
      : '';
    return '<svg class="pip" viewBox="0 0 100 100" aria-hidden="true">' +
      '<ellipse class="body" cx="50" cy="52" rx="34" ry="36"/>' +
      '<ellipse class="belly" cx="50" cy="62" rx="21" ry="22"/>' +
      '<ellipse class="body" cx="17" cy="54" rx="8" ry="14"/>' +
      '<ellipse class="body" cx="83" cy="54" rx="8" ry="14"/>' +
      eyes +
      '<polygon class="beak" points="50,50 44,57 56,57"/>' + mouth +
      '<ellipse class="beak" cx="40" cy="90" rx="7" ry="4"/>' +
      '<ellipse class="beak" cx="60" cy="90" rx="7" ry="4"/>' +
      pipKit() +
      '</svg>';
  }

  /* Pip dresses for the world he's in — a leaf in the forest, a diving bubble
     in the ocean, a helmet in space. Same bird, three places. */
  function pipKit() {
    if (state.world === 2)
      return '<circle cx="50" cy="46" r="40" fill="#bfeefc" opacity=".3"/>' +
             '<circle cx="50" cy="46" r="40" fill="none" stroke="#8fd8ef" stroke-width="3"/>' +

    var pool = poolFor(week);
    var cols = week.patterns.filter(function (k) { return (window.WORDBANK[k]||{}).label; });
    var gap  = pool.filter(function (i) { var g = graphemeFor(i.key); return g && i.word.toLowerCase().indexOf(g) !== -1; });
    var pics = pool.filter(function (i) { return picOf(i.word); });
    /* Spell It needs the child to know which word to build: the voice tells
       them, or failing that a picture does. With neither, it stays hidden. */
    var spel = pool.filter(function (i) { return spellable(i.word) && (canSpeak || picOf(i.word)); });
    var odd  = pool.filter(function (i) { return oddFits(i).length >= 3; });
    var real = pool.filter(function (i) { return fakeable(i.word); });
    return { read: pool.length >= 4, sort: cols.length >= 2 && pool.length >= 6,
             gap: gap.length >= 4, picture: pics.length >= 4,
             listen: canSpeak && pool.length >= 4,
             spell: spel.length >= 4, odd: odd.length >= 4, real: real.length >= 4 };
  }

  // ---------- grammar ----------
  /* The other half of the scope and sequence. Where the word bank is keyed by
     pattern, data/grammar.js is keyed by week, because a grammar focus belongs
     to its week in a way a vowel team doesn't.

     Four kinds of question, and the activity id is the kind with a g on the
     front, so nothing here can collide with a word-study activity. */
  var GRAM  = window.GRAMMAR || {};
  var GACT  = { gfind:"find", gpick:"pick", ggroup:"group", gfix:"fix" };
  var GKIND = ["find", "pick", "group", "fix"];

  function escHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* The answer is the part in [brackets]. Anything without exactly one pair is
     malformed, and returning null here means such a question is skipped rather
     than shown to a child with no right answer in it. */
  function splitAnswer(s) {
    var m = /^([^\[\]]*)\[([^\[\]]+)\]([^\[\]]*)$/.exec(String(s));
    return m ? { before: m[1], answer: m[2], after: m[3] } : null;
  }

  /* A week's blocks of one kind. A block may be written on its own or as a
     list of them, so a week can ask two different questions of the same kind
     — week 1 asks for the noun, then the verb, then the adjective. */
  function blocksOf(weekNum, kind) {
    var wk = GRAM[weekNum];
    if (!wk || !wk[kind]) return [];
    return Array.isArray(wk[kind]) ? wk[kind] : [wk[kind]];
  }

  /* Every question of one kind a week can ask, each carrying the wording of
     the block it came from — which is what lets a review week mix prompts from
     a dozen weeks without any question losing its own question.

     Built once per week and kind and then kept: week 34 pulls in the whole
     year, and the home screen asks about every week each time it draws. */
  var GPOOL = {};
  function grammarPool(weekNum, kind) {
    var ck = weekNum + "|" + kind;
    if (GPOOL[ck]) return GPOOL[ck];

    var out = [], wk = GRAM[weekNum];
    /* `only` narrows a review week to one kind of question — week 35 is
       editing practice, so it takes the Fix It questions and nothing else. */
    if (!wk || (wk.only && wk.only.indexOf(kind) === -1)) return (GPOOL[ck] = out);

    /* A review week borrows from the weeks it names. Those weeks are read for
       their own questions only, never for their review lists — a review of a
       review would go round in circles. */
    [weekNum].concat(wk.review || []).forEach(function (n) {
      blocksOf(n, kind).forEach(function (blk) {
        if (kind === "group") {
          (blk.groups || []).forEach(function (g, gi) {
            (g.words || []).forEach(function (w) {
              out.push({ kind:kind, wk:n, q:blk.q, w:w, gi:gi, groups:blk.groups });
            });
          });
          return;
        }
        (blk.items || []).forEach(function (it) {
          if (kind === "fix") {
            if (!it.ok || !it.bad || !it.bad.length) return;
            out.push({ kind:kind, wk:n, q:blk.q, ok:it.ok, bad:it.bad, why:it.why || "" });
            return;
          }
          var parts = splitAnswer(typeof it === "string" ? it : it.s);
          if (!parts) return;                                  // no answer marked
          if (kind === "pick" && (!it.o || !it.o.length)) return;  // nothing to choose between
          out.push({ kind:kind, wk:n, q:blk.q, tag:blk.tag || "the answer",
                     before:parts.before, answer:parts.answer, after:parts.after,
                     o:(it.o || []), why:(it.why || "") });
        });
      });
    });
    return (GPOOL[ck] = out);
  }

  /* Four is the floor everywhere in this app: fewer than four questions and a
     round is too short to mean anything, so the activity stays hidden. */
  function grammarAvailable(week) {
    var can = {};
    GKIND.forEach(function (k) { can["g" + k] = grammarPool(week.week, k).length >= 4; });
    return can;
  }
  function hasGrammar(week) {
    var can = grammarAvailable(week);
    return GKIND.some(function (k) { return can["g" + k]; });
  }

  var canSpeak = "speechSynthesis" in window;

  /* Pick the best English voice available rather than taking the default,
     which is often the worst one installed. Chromebooks usually have the
     Google voices, which are markedly clearer than the fallbacks. */
  var chosenVoice = null;
  function pickVoice() {
    if (!canSpeak) return null;
    var all = speechSynthesis.getVoices();
    if (!all.length) return null;
    var en = all.filter(function (v) { return /^en(-|_|$)/i.test(v.lang); });
    if (!en.length) return null;
    function score(v) {
      var s = 0;
      if (/google/i.test(v.name)) s += 40;      // clearest in Chrome
      if (/natural|neural/i.test(v.name)) s += 30;
      if (/^en-CA/i.test(v.lang)) s += 12;      // Canadian first
      else if (/^en-GB/i.test(v.lang)) s += 8;
      else if (/^en-US/i.test(v.lang)) s += 6;
      if (v.localService) s += 4;               // no network hiccup mid-word
      return s;
    }
    return en.sort(function (a, b) { return score(b) - score(a); })[0];
  }
  if (canSpeak) {
    chosenVoice = pickVoice();
    // Voices often aren't ready on first paint; re-pick when they arrive.
    speechSynthesis.onvoiceschanged = function () { chosenVoice = pickVoice(); };
  }

  /* Press Hear it again and it says the word more slowly. A child who didn't
     catch it just presses again, with no extra button to find. */
  var lastSaid = "", repeats = 0, lastAt = 0;
  function say(w) {
    if (!canSpeak) return;
    var now = Date.now();
    repeats = (w === lastSaid && now - lastAt < 6000) ? Math.min(repeats + 1, 2) : 0;
    lastSaid = w; lastAt = now;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(SAY_AS[w.toLowerCase()] || w);
      if (chosenVoice) { u.voice = chosenVoice; u.lang = chosenVoice.lang; }
      else u.lang = "en-CA";
      u.rate = [0.8, 0.65, 0.5][repeats];
      u.pitch = 1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function sayBtn(w) { return canSpeak ? '<button class="btn say" data-say="'+w+'">🔊 Hear it</button>' : ""; }

  // ---------- who ----------
  function buildWho() {
    applyWorld();
    $("pipWho").innerHTML = pip("hi");
    var all = loadAll(), names = Object.keys(all.students).sort();
    var list = $("whoList"); list.innerHTML = "";
    names.forEach(function (n) {
      var b = document.createElement("button");
      b.className = "btn"; b.textContent = n + "  ★" + all.students[n].stars;
      b.addEventListener("click", function () { pickReader(n); });
      list.appendChild(b);
    });
    if (!names.length) list.innerHTML = "<p class='sub'>No readers yet — type a name below.</p>";

    $("whoNew").innerHTML =
      '<input class="name-input" id="newName" placeholder="Type your name" maxlength="24">' +
      '<button class="btn primary block" id="addName" style="max-width:320px">Start</button>';
    $("addName").addEventListener("click", function () {
      var n = $("newName").value.trim();
      if (!n) return;
      var d = loadAll();
      // A reader who types their own name starts on core; the teacher can
      // change it later on the progress page.
      if (!d.students[n]) { d.students[n] = { stars:0, rounds:[], level:"core" }; saveAll(d); }
      pickReader(n);
    });
    $("newName").addEventListener("keydown", function (e) { if (e.key === "Enter") $("addName").click(); });
  }

  function pickReader(n) {
    state.who = n;
    state.level = levelOf(n);
    state.week = null;   // a new reader starts from the week list, not the last one's week
    goHome();
  }

  // ---------- home ----------
  /* Coming back from a round keeps the world and week the child was in, so the
     activity grid they left is still open under them. A child who stops in the
     middle of Week 7 shouldn't have to remember it was Week 7. */
  function goHome() { cancelPending(); show("s-home"); buildHome(); }

  function buildHome() {
    applyWorld();
    $("pipHome").innerHTML = pip("hi");
    $("homeMsg").textContent = state.week === null
      ? "Hello " + state.who + "! Pick a week to practise."
      : "Pick something to practise, " + state.who + "!";
    var st = myStars();
    $("homeStars").textContent = st ? "★ " + st + " star" + (st === 1 ? "" : "s") + " so far" : "";
    $("worldName").textContent = WORLDS[state.world].name;

    var tabs = $("worldTabs"); tabs.innerHTML = "";
    [1,2,3].forEach(function (i) {
      var b = document.createElement("button");
      b.className = "wcard w" + i + (i === state.world ? " on" : "");
      b.innerHTML = ICONS[i] + '<span class="wname">' + WORLDS[i].short + '</span>';
      b.addEventListener("click", function () { state.world = i; state.week = null; buildHome(); });
      tabs.appendChild(b);
    });

    var list = $("weekList"); list.innerHTML = "";
    window.SEQUENCE.filter(function (w) { return w.term === WORLDS[state.world].term; })
      .forEach(function (w) {
        /* Review and assessment weeks have no new pattern, but they do have a
           grammar focus — so they're open now, where before they were greyed
           out for the whole year. */
        var has = w.patterns.length || w.morphology.length || hasGrammar(w);
        var b = document.createElement("button");
        b.className = "btn wk" + (w.week === state.week ? " on" : "");
        b.textContent = w.week;
        b.title = w.focus;
        b.disabled = !has;
        b.addEventListener("click", function () { state.week = w.week; buildHome(); });
        list.appendChild(b);
      });

    if (state.week === null) { $("actWrap").classList.add("hidden"); return; }
    $("actWrap").classList.remove("hidden");
    var week = weekByNum(state.week), can = available(week), gcan = grammarAvailable(week);
    $("weekFocus").textContent = "Week " + week.week + " — " + week.focus;

    /* Two strands, labelled, in the order the sequence pairs them: the week's
       words first, then the week's grammar. A strand with nothing to offer is
       hidden rather than shown full of dead buttons. */
    fillActs($("acts"),
      [ { id:"read",    emoji:"📖", name:"Read It",        why:"Read each word out loud.",         ok:can.read },
        { id:"listen",  emoji:"👂", name:"Hear It",        why:"Listen, then pick the word.",      ok:can.listen },
        { id:"picture", emoji:"🖼️", name:"Picture Match",  why:"Match the picture to the word.",   ok:can.picture },
        { id:"spell",   emoji:"🔤", name:"Spell It",       why:"Build the word from letters.",     ok:can.spell },
        { id:"sort",    emoji:"🗂️", name:"Sort It",        why:"Put the word in the right group.", ok:can.sort },
        { id:"gap",     emoji:"🧩", name:"Missing Piece",  why:"Choose the letters that fit.",     ok:can.gap },
        { id:"odd",     emoji:"🔍", name:"Odd One Out",    why:"Find the word that doesn't fit.",  ok:can.odd },
        { id:"real",    emoji:"🤔", name:"Real or Not",    why:"Is it a real word?",               ok:can.real }
      ]);

    fillActs($("gacts"),
      [ { id:"gfind",  emoji:"👉", name:"Find the Word",  why:"Tap the word in the sentence.",    ok:gcan.gfind },
        { id:"gpick",  emoji:"✏️", name:"Which Word?",    why:"Choose the word that fits.",       ok:gcan.gpick },
        { id:"ggroup", emoji:"🧺", name:"Which Kind?",    why:"Say which group it goes in.",      ok:gcan.ggroup },
        { id:"gfix",   emoji:"✍️", name:"Fix It",         why:"Pick the sentence written right.", ok:gcan.gfix }
      ]);

    $("gramLabel").textContent = "Grammar — " + week.grammar;
    /* A whole strand with nothing in it is hidden, heading and all. A review
       week has no words, and hiding the empty Word study grid is kinder than
       showing eight dead buttons above the grammar the week is actually for. */
    $("wordWrap").classList.toggle("hidden", !anyOk(can));
    $("gramWrap").classList.toggle("hidden", !anyOk(gcan));
  }

  function anyOk(flags) {
    return Object.keys(flags).some(function (k) { return flags[k]; });
  }

  function fillActs(box, list) {
    box.innerHTML = "";
    list.forEach(function (a) {
      var b = document.createElement("button");
      b.className = "btn act"; b.disabled = !a.ok;
      b.innerHTML = "<span class='emoji'>"+a.emoji+"</span><span class='name'>"+a.name+"</span>" +
                    "<span class='why'>"+(a.ok ? a.why : "Not for this week.")+"</span>";
      b.addEventListener("click", function () { start(a.id); });
      box.appendChild(b);
    });
  }

  // ---------- rounds ----------
  function start(activity) {
    var week = weekByNum(state.week);
    state.activity = activity; state.at = 0; state.right = 0; state.tricky = [];

    /* Grammar rounds are drawn straight from the week's questions. There are no
       word tiers to respect here — see the note in data/grammar.js. */
    if (GACT[activity]) {
      state.queue = shuffled(grammarPool(state.week, GACT[activity])).slice(0, ROUND);
      show("s-play"); buildDots(); nextQ();
      return;
    }

    var pool = poolFor(week);

    if (activity === "gap")     pool = pool.filter(function (i) { var g = graphemeFor(i.key); return g && i.word.toLowerCase().indexOf(g) !== -1; });
    if (activity === "picture") pool = pool.filter(function (i) { return picOf(i.word); });
    if (activity === "spell")   pool = pool.filter(function (i) { return spellable(i.word) && (canSpeak || picOf(i.word)); });
    if (activity === "odd")     pool = pool.filter(function (i) { return oddFits(i).length >= 3; });
    if (activity === "real")    pool = pool.filter(function (i) { return fakeable(i.word); });
    if (activity === "sort") {
      state.columns = week.patterns.filter(function (k) { return (window.WORDBANK[k]||{}).label; });
      pool = pool.filter(function (i) { return state.columns.indexOf(i.key) !== -1; });
    }
    if (activity === "odd") {
      /* Foils come from patterns this week isn't studying, so the odd one out
         is genuinely a different pattern rather than a near-miss. */
      var inWeek = week.patterns.concat(week.morphology);
      state.foils = ALL_WORDS.filter(function (x) { return inWeek.indexOf(x.key) === -1; });
    }
    /* poolFor has already shuffled within each tier and put the reader's own
       level first. Reshuffling here would undo that, so just take the front. */
    state.queue = pool.slice(0, ROUND);
    show("s-play"); buildDots(); nextQ();
  }

  function buildDots() {
    var d = $("dots"); d.innerHTML = "";
    state.queue.forEach(function (_, i) {
      var e = document.createElement("div"); e.className = "dot" + (i === 0 ? " now" : ""); d.appendChild(e);
    });
  }
  function markDot(i, ok) {
    var d = $("dots").children;
    if (d[i]) d[i].className = "dot " + (ok ? "done" : "miss");
    if (d[i+1]) d[i+1].className = "dot now";
  }
  function nextQ() {
    $("feedback").textContent = ""; $("feedback").className = "feedback";
    $("nextBtn").classList.add("hidden");
    if (state.at >= state.queue.length) return finish();
    var it = state.queue[state.at];
    if (GACT[state.activity])         return askGrammar(it);
    if (state.activity === "read")    return askRead(it);
    if (state.activity === "listen")  return askListen(it);
    if (state.activity === "picture") return askPicture(it);
    if (state.activity === "spell")   return askSpell(it);
    if (state.activity === "sort")    return askSort(it);
    if (state.activity === "odd")     return askOdd(it);
    if (state.activity === "real")    return askReal(it);
    return askGap(it);
  }
  /* The pause between answering and the next question, scaled to how much
     there is to read. See READ_MS_PER_CHAR at the top of this script for the
     pace and how to change it.

     Every ask* function sets the feedback before calling this, which is why
     the message can simply be read back off the screen here. */
  var pendingNext = null;

  function cancelPending() {
    if (pendingNext) { clearTimeout(pendingNext); pendingNext = null; }
    $("nextBtn").classList.add("hidden");
  }

  /* Both the timer and the Next button come through here, so neither can
     double-fire, and a child who quit mid-feedback is never dragged into a
     score screen by a pause that was still running. */
  function goNext() {
    cancelPending();
    if ($("s-play").classList.contains("hidden")) return;
    nextQ();
  }

  /* What a missed question leaves on the teacher's list. A word-study miss is
     the word itself. A grammar miss is the name of the skill, not the sentence
     — "Commas in a series ×4" is the small-group list; four whole sentences
     quoted back is not. */
  function missLabel(it) {
    if (!it) return "";
    if (it.word) return it.word;
    return (GRAM[it.wk] || {}).name || "";
  }

  function advance(ok, item) {
    if (ok) state.right++;
    else { var miss = missLabel(item); if (miss) state.tricky.push(miss); }
    markDot(state.at, ok); state.at++;

    var msg  = $("feedback").textContent || "";
    var hold = (ok ? READ_MIN_RIGHT : READ_MIN_WRONG) +
               Math.max(0, msg.length - READ_FREE_CHARS) * READ_MS_PER_CHAR;

    $("nextBtn").classList.remove("hidden");
    pendingNext = setTimeout(goNext, Math.min(hold, READ_MAX));
  }
  function wire() {
    document.querySelectorAll("[data-say]").forEach(function (b) {
      b.addEventListener("click", function () { say(b.getAttribute("data-say")); });
    });
  }
  function lockAndMark(sel, isRight, correctAttrVal, attr) {
    document.querySelectorAll(sel).forEach(function (x) {
      x.disabled = true;
      if (!isRight && x.getAttribute(attr) === correctAttrVal) x.className = "btn choice right";
    });
  }

  // Read It — the child reads aloud and marks themselves. The app can't hear them.
  function askRead(it) {
    var p = picOf(it.word);
    $("stage").innerHTML = "<div class='stage'>" + (p ? "<div class='pic'>"+p+"</div>" : "") +
      "<p class='the-word'>"+it.word+"</p>" + sayBtn(it.word) + "</div>" +
      "<div class='choices'><button class='btn choice' data-read='yes'>I read it<span class='small'>easy</span></button>" +
      "<button class='btn choice' data-read='no'>Tricky<span class='small'>come back to it</span></button></div>";
    wire();
    document.querySelectorAll("[data-read]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ok = b.getAttribute("data-read") === "yes";
        b.className = "btn choice " + (ok ? "right" : "wrong");
        $("feedback").textContent = ok ? "Nice reading!" : "That one goes on your list.";
        $("feedback").className = "feedback " + (ok ? "good" : "bad");
        advance(ok, it);
      });
    });
  }

  // Picture Match — meaning, not just decoding. The point of this one for ESL.
  function askPicture(it) {
    var others = shuffled(state.queue.filter(function (x) { return x.word !== it.word; }))
                   .slice(0, 2).map(function (x) { return x.word; });
    var opts = shuffled(others.concat([it.word]));
    $("stage").innerHTML = "<div class='stage'><div class='pic'>"+picOf(it.word)+"</div>" +
      "<p class='sub'>Which word is this?</p></div>" +
      "<div class='choices'>" + opts.map(function (o) {
        return "<button class='btn choice' data-word='"+o+"'>"+o+"</button>"; }).join("") + "</div>";
    document.querySelectorAll("[data-word]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ok = b.getAttribute("data-word") === it.word;
        b.className = "btn choice " + (ok ? "right" : "wrong");
        lockAndMark("[data-word]", ok, it.word, "data-word");
        $("feedback").textContent = ok ? "Yes — " + it.word + "!" : "This one is " + it.word + ".";
        $("feedback").className = "feedback " + (ok ? "good" : "bad");
        say(it.word);
        advance(ok, it);
      });
    });
  }

  function askSort(it) {
    var p = picOf(it.word), cols = shuffled(state.columns);
    $("stage").innerHTML = "<div class='stage'>" + (p ? "<div class='pic'>"+p+"</div>" : "") +
      "<p class='the-word'>"+it.word+"</p>" + sayBtn(it.word) + "</div>" +
      "<div class='choices'>" + cols.map(function (k) {
        return "<button class='btn choice' data-key='"+k+"'>"+shortLabel(k) +
               "<span class='small'>"+window.WORDBANK[k].label+"</span></button>"; }).join("") + "</div>";
    wire();
    document.querySelectorAll("[data-key]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ok = b.getAttribute("data-key") === it.key;
        b.className = "btn choice " + (ok ? "right" : "wrong");
        lockAndMark("[data-key]", ok, it.key, "data-key");
        $("feedback").textContent = ok ? "That's the one!" : "It goes with " + shortLabel(it.key) + ".";
        $("feedback").className = "feedback " + (ok ? "good" : "bad");
        advance(ok, it);
      });
    });
  }

  function askGap(it) {
    var g = graphemeFor(it.key), w = it.word, i = w.toLowerCase().indexOf(g), p = picOf(w);
    var shown = w.slice(0,i) + "<span class='gap'>" + w.substr(i,g.length) + "</span>" + w.slice(i+g.length);
    var pool = Object.keys(window.WORDBANK).map(graphemeFor)
      .filter(function (x) { return x && x.length === g.length && x !== g; });
    var opts = shuffled(pool.filter(function (v,ix,a) { return a.indexOf(v) === ix; })).slice(0,2);
    opts = shuffled(opts.concat([g]));

    $("stage").innerHTML = "<div class='stage'>" + (p ? "<div class='pic'>"+p+"</div>" : "") +
      "<p class='the-word'>"+shown+"</p>" + sayBtn(w) + "</div>" +
      "<div class='choices'>" + opts.map(function (o) {
        return "<button class='btn choice' data-opt='"+o+"'>"+o+"</button>"; }).join("") + "</div>";
    wire();
    document.querySelectorAll("[data-opt]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ok = b.getAttribute("data-opt") === g;
        b.className = "btn choice " + (ok ? "right" : "wrong");
        lockAndMark("[data-opt]", ok, g, "data-opt");
        var el = $("stage").querySelector(".gap"); if (el) el.style.color = "inherit";
        $("feedback").textContent = ok ? "Yes — " + w + "!" : "It's " + w + ".";
        $("feedback").className = "feedback " + (ok ? "good" : "bad");
        say(w);
        advance(ok, it);
      });
    });
  }

  /* Hear It — the only activity that starts from sound rather than print.
     Nothing is shown until they answer, so it tests the sound-to-spelling
     direction that Read It can't (the app can't hear the child). */
  function askListen(it) {
    /* Distractors from the same pattern where possible — shirt / skirt / first
       is a listening test; shirt / painless / sleepless is a giveaway. */
    var pool = state.queue.filter(function (x) { return x.word !== it.word; });
    var others = shuffled(pool.filter(function (x) { return x.key === it.key; }))
                   .concat(shuffled(pool.filter(function (x) { return x.key !== it.key; })))
                   .slice(0, 2).map(function (x) { return x.word; });
    var opts = shuffled(others.concat([it.word]));
    $("stage").innerHTML = "<div class='stage'><div class='listen-big'>👂</div>" +
      "<p class='sub'>Which word did you hear?</p>" + sayBtn(it.word) + "</div>" +
      "<div class='choices'>" + opts.map(function (o) {
        return "<button class='btn choice' data-heard='"+o+"'>"+o+"</button>"; }).join("") + "</div>";
    wire();
    say(it.word);   // and pressing Hear it repeats it slower, as everywhere else
    document.querySelectorAll("[data-heard]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ok = b.getAttribute("data-heard") === it.word;
        b.className = "btn choice " + (ok ? "right" : "wrong");
        lockAndMark("[data-heard]", ok, it.word, "data-heard");
        $("feedback").textContent = ok ? "Yes — " + it.word + "!" : "That one was " + it.word + ".";
        $("feedback").className = "feedback " + (ok ? "good" : "bad");
        advance(ok, it);
      });
    });
  }

  /* Spell It — the reverse of Missing Piece: nothing is given except the
     sound and the picture, and every letter has to be placed. */
  function askSpell(it) {
    var w = it.word, p = picOf(w), letters = w.split("");
    var order = shuffled(letters.map(function (_, i) { return i; }));
    // A scramble that comes out in the right order hands them the answer.
    if (w.length > 1 && order.every(function (v, i) { return letters[v] === letters[i]; })) {
      order = order.slice().reverse();
    }
    var picked = [];

    $("stage").innerHTML = "<div class='stage'>" + (p ? "<div class='pic'>"+p+"</div>" : "") +
      "<p class='sub'>Listen, then build the word.</p>" + sayBtn(w) +
      "<div class='built' id='built'></div></div>" +
      "<div class='tiles' id='tiles'></div>" +
      "<div style='text-align:center;margin-top:14px'><button class='btn' id='undo'>← Undo</button></div>";
    wire();

    var tiles = $("tiles");
    order.forEach(function (srcIdx, slot) {
      var b = document.createElement("button");
      b.className = "tile"; b.textContent = letters[srcIdx];
      b.addEventListener("click", function () {
        if (b.disabled) return;
        picked.push({ slot: slot, ch: letters[srcIdx] });
        b.disabled = true;
        draw();
        if (picked.length === w.length) check();
      });
      tiles.appendChild(b);
    });

    $("undo").addEventListener("click", function () {
      var last = picked.pop();
      if (last) tiles.children[last.slot].disabled = false;
      draw();
    });

    function draw() {
      var got = picked.map(function (x) { return x.ch; }).join("");
      var blanks = new Array(w.length - picked.length + 1).join("_");
      $("built").innerHTML = got + "<span class='blank'>" + blanks + "</span>";
    }
    function check() {
      var got = picked.map(function (x) { return x.ch; }).join("");
      var ok = got === w;
      $("built").className = "built " + (ok ? "right" : "wrong");
      if (!ok) $("built").innerHTML = w;
      Array.prototype.forEach.call(tiles.children, function (t) { t.disabled = true; });
      $("undo").disabled = true;
      $("feedback").textContent = ok ? "That's it — " + w + "!" : "Not quite — it's " + w + ".";
      $("feedback").className = "feedback " + (ok ? "good" : "bad");
      say(w);
      advance(ok, it);
    }
    draw();
    say(w);
  }

  /* Odd One Out — three words showing this week's pattern, one from a pattern
     the week isn't studying. Wrong answers are recorded against the week word
     the question was built from, so the teacher's list stays useful. */
  function askOdd(it) {
    var g = graphemeFor(it.key);
    var fits = [it.word].concat(
      shuffled(oddFits(it).filter(function (w) { return w !== it.word; })).slice(0, 2));
    var candidates = (state.foils || ALL_WORDS).filter(function (x) {
      return x.word.toLowerCase().indexOf(g) === -1 && fits.indexOf(x.word) === -1;
    });
    var foil = candidates[Math.floor(Math.random() * candidates.length)];
    // Should never happen given the gate, but degrade to a readable question
    // rather than showing a broken one.
    if (fits.length < 3 || !foil) return askRead(it);

    var opts = shuffled(fits.concat([foil.word]));
    $("stage").innerHTML = "<div class='stage'><p class='sub'>Three of these go together.<br>" +
      "Which one does <strong>not</strong> fit?</p></div>" +
      "<div class='choices'>" + opts.map(function (o) {
        return "<button class='btn choice' data-odd='"+o+"'>"+o+"</button>"; }).join("") + "</div>";
    document.querySelectorAll("[data-odd]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ok = b.getAttribute("data-odd") === foil.word;
        b.className = "btn choice " + (ok ? "right" : "wrong");
        lockAndMark("[data-odd]", ok, foil.word, "data-odd");
        $("feedback").textContent = ok
          ? "Yes — the others are " + shortLabel(it.key) + " words."
          : "It's " + foil.word + " — the others are " + shortLabel(it.key) + " words.";
        $("feedback").className = "feedback " + (ok ? "good" : "bad");
        say(foil.word);
        advance(ok, it);
      });
    });
  }

  /* Real or Not — the word, or a made-up one built by swapping the opening
     consonants and keeping the week's pattern (brain → blain). makeFake
     refuses to return anything that might be a real word; when it refuses,
     the real word is shown instead. The voice only ever says the REAL word. */
  function askReal(it) {
    var w = it.word;
    var fake = Math.random() < 0.5 ? makeFake(w, graphemeFor(it.key)) : null;
    var shown = fake || w, isReal = !fake;

    $("stage").innerHTML = "<div class='stage'><p class='the-word'>" + shown + "</p>" +
      "<p class='sub'>Is this a real word?</p></div>" +
      "<div class='choices'>" +
      "<button class='btn choice' data-real='yes'>Real word</button>" +
      "<button class='btn choice' data-real='no'>Not a word</button></div>";
    document.querySelectorAll("[data-real]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ok = (b.getAttribute("data-real") === "yes") === isReal;
        b.className = "btn choice " + (ok ? "right" : "wrong");
        lockAndMark("[data-real]", ok, isReal ? "yes" : "no", "data-real");
        $("feedback").textContent = isReal
          ? (ok ? "Yes — " + w + " is a real word." : "It is real — " + w + ".")
          : (ok ? "Right, that's not a word. The real one is " + w + "."
                : "Not a word — the real one is " + w + ".");
        $("feedback").className = "feedback " + (ok ? "good" : "bad");
        say(w);
        advance(ok, it);
      });
    });
  }

  /* ---------- grammar activities ----------
     All four have the same shape: the question at the top, something to choose
     between, then the rule underneath the answer. The rule is the point — a
     child who guesses right and reads why still learns something. */

  function askGrammar(it) {
    if (it.kind === "find")  return askFind(it);
    if (it.kind === "pick")  return askPick(it);
    if (it.kind === "group") return askGroup(it);
    return askFix(it);
  }

  /* Verdict on one line, rule on the next, both inside #feedback — so the
     pause before the next question counts the rule too, which is the whole
     reason the pause scales with length. */
  function tell(ok, msg, why) {
    var f = $("feedback");
    f.className = "feedback " + (ok ? "good" : "bad");
    f.innerHTML = escHtml(msg) + (why ? "<span class='why'>" + escHtml(why) + "</span>" : "");
  }

  /* sayBtn puts the word in an HTML attribute, which a sentence carrying
     quotation marks would break. These hand the text over in a closure. */
  function hearBtn() { return canSpeak ? '<button class="btn say" id="sayIt">🔊 Hear it</button>' : ""; }
  function hearWire(text) {
    var b = $("sayIt");
    if (b) b.addEventListener("click", function () { say(text); });
  }

  /* Find the Word — every word in the sentence is tappable. The answer was
     marked with [brackets] in data/grammar.js; the marker below survives the
     split into words, so punctuation stays stuck to the word it belongs to. */
  function askFind(it) {
    var MARK = "\u0001";   // never appears in a sentence, so it cannot be typed by accident
    var toks = (it.before + MARK + it.answer + MARK + it.after)
                 .split(/\s+/).filter(function (t) { return t.length; });

    $("stage").innerHTML = "<div class='stage'><p class='ask'>" + escHtml(it.q) + "</p>" +
      "<p class='sent' id='sent'></p>" + hearBtn() + "</div>";
    hearWire(it.before + it.answer + it.after);

    var sent = $("sent");
    toks.forEach(function (t, i) {
      var isAns = t.indexOf(MARK) !== -1;
      var b = document.createElement("button");
      b.className = "tok";
      b.textContent = t.split(MARK).join("");
      b.setAttribute("data-ans", isAns ? "1" : "0");
      b.addEventListener("click", function () {
        b.className = "tok " + (isAns ? "right" : "wrong");
        sent.querySelectorAll(".tok").forEach(function (x) {
          x.disabled = true;
          if (!isAns && x.getAttribute("data-ans") === "1") x.className = "tok right";
        });
        tell(isAns, isAns ? "Yes — " + it.answer + " is " + it.tag + "."
                          : it.answer + " is " + it.tag + ".", it.why);
        advance(isAns, it);
      });
      sent.appendChild(b);
      if (i < toks.length - 1) sent.appendChild(document.createTextNode(" "));
    });
  }

  /* Which Word? — the answer is lifted out of the sentence and offered beside
     the wrong choices the week supplies. Nothing is spoken beforehand: the
     sentence read aloud would hand over the answer. */
  function askPick(it) {
    var opts = shuffled([it.answer].concat(it.o));

    $("stage").innerHTML = "<div class='stage'><p class='ask'>" + escHtml(it.q) + "</p>" +
      "<p class='sent'>" + escHtml(it.before) +
      "<span class='blankw' id='blank'>&nbsp;</span>" + escHtml(it.after) + "</p></div>" +
      "<div class='choices'>" + opts.map(function (o, i) {
        return "<button class='btn choice' data-opt-i='" + i + "'>" + escHtml(o) + "</button>";
      }).join("") + "</div>";

    document.querySelectorAll("[data-opt-i]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ok = opts[+b.getAttribute("data-opt-i")] === it.answer;
        b.className = "btn choice " + (ok ? "right" : "wrong");
        document.querySelectorAll("[data-opt-i]").forEach(function (x) {
          x.disabled = true;
          if (!ok && opts[+x.getAttribute("data-opt-i")] === it.answer) x.className = "btn choice right";
        });
        var blank = $("blank");
        blank.textContent = it.answer;
        blank.className = "blankw filled " + (ok ? "right" : "wrong");
        /* Punctuation answers get their own wording. "It's ?." is a sentence
           with two end marks in it and reads as a typo. */
        var isWord = /[a-z]/i.test(it.answer);
        tell(ok, isWord ? (ok ? "Yes — " + it.answer + "." : "It's " + it.answer + ".")
                        : (ok ? "Yes — it's  " + it.answer : "The mark is  " + it.answer), it.why);
        /* The finished sentence is worth hearing, but only when the answer is
           a word — a comma and a period sound exactly alike. */
        if (isWord) say(it.before + it.answer + it.after);
        advance(ok, it);
      });
    });
  }

  /* Which Kind? — the same idea as Sort It, on grammar rather than spelling. */
  function askGroup(it) {
    var order = shuffled(it.groups.map(function (_, i) { return i; }));
    var short = it.w.length <= 16;

    $("stage").innerHTML = "<div class='stage'><p class='ask'>" + escHtml(it.q) + "</p>" +
      (short ? "<p class='the-word'>" : "<p class='sent'>") + escHtml(it.w) + "</p>" +
      hearBtn() + "</div>" +
      "<div class='choices'>" + order.map(function (gi) {
        var g = it.groups[gi];
        return "<button class='btn choice' data-gi='" + gi + "'>" + escHtml(g.label) +
               (g.hint ? "<span class='small'>" + escHtml(g.hint) + "</span>" : "") + "</button>";
      }).join("") + "</div>";
    hearWire(it.w);

    document.querySelectorAll("[data-gi]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ok = +b.getAttribute("data-gi") === it.gi;
        b.className = "btn choice " + (ok ? "right" : "wrong");
        lockAndMark("[data-gi]", ok, String(it.gi), "data-gi");
        tell(ok, ok ? "That's the one!" : "It goes with " + it.groups[it.gi].label + ".", it.why);
        advance(ok, it);
      });
    });
  }

  /* Fix It — three versions of a sentence, one written correctly. They stack
     down the screen rather than sitting in a row, because they're sentences. */
  function askFix(it) {
    var opts = shuffled([it.ok].concat(it.bad));

    $("stage").innerHTML = "<div class='stage'><p class='ask'>" + escHtml(it.q) + "</p></div>" +
      "<div class='choices stack'>" + opts.map(function (o, i) {
        return "<button class='btn choice' data-opt-i='" + i + "'>" + escHtml(o) + "</button>";
      }).join("") + "</div>";

    document.querySelectorAll("[data-opt-i]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ok = opts[+b.getAttribute("data-opt-i")] === it.ok;
        b.className = "btn choice " + (ok ? "right" : "wrong");
        document.querySelectorAll("[data-opt-i]").forEach(function (x) {
          x.disabled = true;
          if (!ok && opts[+x.getAttribute("data-opt-i")] === it.ok) x.className = "btn choice right";
        });
        tell(ok, ok ? "That's the one!" : "Not quite — the right one is marked.", it.why);
        advance(ok, it);
      });
    });
  }

  // ---------- done ----------
  function finish() {
    var total = state.queue.length, pct = total ? state.right/total : 0;
    var stars = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .4 ? 1 : 0;

    var round = { id: roundId(),
                  d: new Date().toISOString().slice(0,10), w: state.week,
                  a: state.activity, r: state.right, t: total, s: stars,
                  l: state.level, tricky: state.tricky.slice(0,20) };
    record(round);      // this device, always
    queueRound(round);  // the teacher's Sheet, if one is set up

    $("pipDone").innerHTML = pip(stars >= 2 ? "cheer" : "think");
    $("doneMsg").textContent =
      stars === 3 ? "You've really got this one!" :
      stars === 2 ? "Good work — nearly there." :
      stars === 1 ? "Keep going, it's getting easier." :
                    "Tricky week. Ask your teacher to do this one with you.";
    $("scoreBig").textContent = state.right + " / " + total;
    $("gotStars").textContent = "★★★".slice(0,stars) + "☆☆☆".slice(0,3-stars);

    $("trickyBox").innerHTML = state.tricky.length
      ? "<div class='tricky'><h3>Words to come back to</h3><ul>" +
        state.tricky.map(function (w) { return "<li>"+w+"</li>"; }).join("") + "</ul></div>"
      : "";
    show("s-done");
  }

  /* Interleaved on purpose: reading, listening, sorting, building. Two
     activities of the same kind shouldn't land back to back. */
  var WORD_ROTATION = ["read","listen","sort","spell","picture","odd","gap","real"];
  var GRAM_ROTATION = ["gfind","gpick","ggroup","gfix"];

  /* Keep going: rotate through whatever this week supports, so an open-ended
     session doesn't become the same activity ten times over — but stay in the
     strand they chose. A child working on commas shouldn't be dropped into
     vowel teams because the round happened to end. */
  function keepGoing() {
    var week = weekByNum(state.week), can = available(week), gcan = grammarAvailable(week);
    var mine = GACT[state.activity] ? GRAM_ROTATION : WORD_ROTATION;
    var order = mine.filter(function (a) { return can[a] || gcan[a]; });

    // A strand with only the one activity has nowhere to rotate to, so widen.
    if (order.length < 2) {
      order = WORD_ROTATION.filter(function (a) { return can[a]; })
                .concat(GRAM_ROTATION.filter(function (a) { return gcan[a]; }));
    }
    if (!order.length) return goHome();
    state.rotate = (state.rotate + 1) % order.length;
    start(order[state.rotate]);
  }

  function show(id) {
    ["s-who","s-home","s-play","s-done"].forEach(function (s) {
      $(s).classList.toggle("hidden", s !== id);
    });
    /* Mid-round the scenery fades back. The world is a reward and a place to
       be, but nothing decorative should compete with the word being read. */
    document.body.classList.toggle("playing", id === "s-play");
    document.body.classList.toggle("at-home", id === "s-home");
    window.scrollTo(0,0);
  }

  $("nextBtn").addEventListener("click", goNext);
  $("quit").addEventListener("click", goHome);
  $("keepGoing").addEventListener("click", keepGoing);
  $("pickOther").addEventListener("click", goHome);
  $("switchUser").addEventListener("click", function () { state.who = null; show("s-who"); buildWho(); });

  /* Anything stranded by bad wifi last time goes out as soon as we load. */
  flushQueue();

  buildWho();
})();
</script>
</body>
</html>
